<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Broadcast Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-black uppercase tracking-tighter">Broadcaster Center</h1>
            <p class="text-slate-500 font-bold uppercase tracking-widest text-xs">Gestión Elián - Esquipulas</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <button onclick="iniciarCaptura()" class="p-8 bg-blue-600 hover:bg-blue-700 rounded-3xl font-black text-lg flex items-center justify-center gap-3 shadow-xl transition-all">
                <i data-lucide="monitor"></i> INICIAR CAPTURA
            </button>
            <button id="btnPublicar" onclick="publicar()" disabled class="p-8 bg-green-700 disabled:bg-slate-800 rounded-3xl font-black text-lg shadow-xl transition-all">
                PUBLICAR SEÑAL
            </button>
        </div>

        <div class="bg-black border-4 border-slate-800 rounded-3xl overflow-hidden aspect-video flex items-center justify-center">
            <video id="preview" autoplay muted playsinline class="w-full h-full object-contain"></video>
            <span id="mensaje" class="text-slate-700 font-black tracking-widest uppercase text-sm">Sin señal</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        const db = getFirestore(initializeApp(JSON.parse(__firebase_config)));
        const auth = getAuth(auth);
        signInAnonymously(auth);

        window.iniciarCaptura = async () => {
            try {
                // Intento básico de captura sin restricciones
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const video = document.getElementById('preview');
                video.srcObject = stream;
                document.getElementById('mensaje').classList.add('hidden');
                document.getElementById('btnPublicar').disabled = false;
            } catch (err) {
                alert("Error crítico: " + err.message + ". Asegúrate de estar en un servidor seguro (HTTPS).");
            }
        };

        window.publicar = async () => {
            await setDoc(doc(db, 'artifacts', 'broadcast-system', 'platform', 'state'), {
                isLive: true,
                updatedAt: Date.now()
            });
            alert("Señal publicada en Firebase.");
        };

        lucide.createIcons();
    </script>
</body>
</html>
