<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
    </style>
</head>
<body class="p-8 flex flex-col min-h-screen">
    <header class="flex justify-between items-center bg-slate-800 p-6 rounded-3xl mb-8 border border-white/10">
        <div class="flex items-center gap-4">
            <img src="LOGO COOSAJO SIN ESLOGAN.png" class="h-12">
            <div>
                <h1 class="text-xl font-black uppercase tracking-tight">Emisor Maestro "El Magic"</h1>
                <p class="text-green-400 text-xs font-bold uppercase tracking-widest">ID: COOSAJO-MASTER-MAGIC</p>
            </div>
        </div>
        <div id="statusDot" class="flex items-center gap-2 bg-red-500/20 text-red-500 px-4 py-2 rounded-xl border border-red-500/30">
            <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
            <span class="text-xs font-black uppercase">Desconectado</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-black rounded-[2rem] overflow-hidden border-4 border-slate-700 relative aspect-video flex items-center justify-center">
            <video id="localVideo" class="w-full h-full object-contain" autoplay muted playsinline></video>
            <div id="noVideo" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600">
                <i data-lucide="video-off" class="w-12 h-12 mb-2"></i>
                <span class="font-bold uppercase text-xs">Sin Señal de OBS</span>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            <div class="bg-white/5 p-8 rounded-3xl border border-white/10">
                <h3 class="text-sm font-black uppercase text-blue-400 mb-6">Controles de Emisión</h3>
                <button onclick="iniciar()" class="w-full bg-[#158e45] hover:bg-green-500 text-white py-6 rounded-2xl font-black uppercase tracking-widest transition-all shadow-xl flex items-center justify-center gap-4">
                    <i data-lucide="monitor"></i> Capturar Stick/OBS
                </button>
                <p class="text-[10px] text-slate-400 mt-4 text-center leading-relaxed">
                    Al iniciar, las agencias se conectarán automáticamente. <br>Recuerde marcar "Compartir audio del sistema".
                </p>
            </div>
            
            <div class="bg-blue-500/5 p-6 rounded-3xl border border-blue-500/20">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-black uppercase text-blue-400">Monitoreo de Audio</span>
                    <span id="dbValue" class="text-[10px] font-mono text-blue-300">0%</span>
                </div>
                <div class="h-4 bg-black/40 rounded-full overflow-hidden flex gap-0.5 p-1">
                    <div id="vBar" class="h-full bg-gradient-to-r from-green-500 via-yellow-500 to-red-500 transition-all duration-75" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        let localStream;
        const peer = new Peer('COOSAJO-MASTER-MAGIC');

        peer.on('open', () => {
            const status = document.getElementById('statusDot');
            status.classList.replace('bg-red-500/20', 'bg-green-500/20');
            status.classList.replace('text-red-500', 'text-green-400');
            status.querySelector('div').classList.replace('bg-red-500', 'bg-green-500');
            status.querySelector('span').textContent = 'Listo para emitir';
        });

        peer.on('call', (call) => {
            if (localStream) {
                call.answer(localStream);
                console.log("Nueva agencia conectada");
            }
        });

        async function iniciar() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: {frameRate: 60}, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('noVideo').classList.add('hidden');
                setupAudio(localStream);
            } catch (e) { console.error(e); }
        }

        function setupAudio(stream) {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);
            function loop() {
                ana.getByteFrequencyData(data);
                const avg = data.reduce((a,b) => a+b) / data.length;
                const perc = (avg / 128) * 100;
                document.getElementById('vBar').style.width = perc + '%';
                document.getElementById('dbValue').textContent = Math.round(perc) + '%';
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
