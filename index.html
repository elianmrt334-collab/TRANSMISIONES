<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-8">

    <header class="flex justify-between items-center mb-12">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-[#158e45] rounded-xl flex items-center justify-center shadow-lg">
                <i data-lucide="radio" class="text-white w-7 h-7"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter italic">Mesa Técnica Master</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">COOSAJO R.L. es MICOOPE</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="spectators" class="glass px-4 py-2 rounded-xl flex items-center gap-2 border-green-500/20">
                <i data-lucide="users" class="w-4 h-4 text-[#158e45]"></i>
                <span id="connCount" class="text-sm font-black text-green-400">0 pantallas</span>
            </div>
            <div class="glass px-6 py-3 rounded-2xl flex items-center gap-3">
                <div id="statusDot" class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="statusLabel" class="text-sm font-black uppercase tracking-widest">Desconectado</span>
            </div>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-6">
            <div class="glass p-8 rounded-[2.5rem] space-y-8 border-t-4 border-[#158e45] shadow-2xl">
                <h2 class="text-xl font-black uppercase tracking-tight text-[#158e45]">Control de Emisión</h2>
                
                <div class="space-y-4">
                    <button id="btnStart" onclick="iniciarTransmision()" class="w-full bg-[#158e45] hover:bg-[#1bbd5c] text-white py-6 rounded-2xl font-black text-2xl flex items-center justify-center gap-4 transition-all shadow-xl">
                        <i data-lucide="play-circle" class="w-8 h-8"></i>
                        INICIAR SEÑAL
                    </button>
                    
                    <button id="btnStop" onclick="detenerTransmision()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white py-6 rounded-2xl font-black text-2xl flex items-center justify-center gap-4 transition-all border border-red-500/30 disabled:opacity-30" disabled>
                        <i data-lucide="stop-circle" class="w-8 h-8"></i>
                        FINALIZAR SEÑAL
                    </button>
                </div>

                <div class="p-4 bg-white/5 rounded-2xl">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">Instrucciones:</p>
                    <ul class="text-[10px] text-slate-500 space-y-1">
                        <li>• Use "Proyector de Ventana" en OBS.</li>
                        <li>• Capture esa ventana con el botón verde.</li>
                        <li>• Asegure compartir el audio del sistema.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 relative glass rounded-[2.5rem] overflow-hidden bg-black flex items-center justify-center border-4 border-white/5 shadow-2xl">
            <video id="previewVideo" class="w-full h-full object-contain" autoplay muted playsinline></video>
            <div id="noSignal" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90">
                <i data-lucide="monitor-off" class="w-20 h-20 text-slate-700 mb-4"></i>
                <p class="text-slate-500 font-black uppercase tracking-[0.4em]">Esperando Señal de OBS</p>
            </div>
            <div id="liveBadge" class="absolute top-6 left-6 bg-red-600 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest opacity-0 transition-opacity">
                En Vivo
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const MASTER_KEY = 'COOSAJO-MASTER-MAGIC'; 
        let peer = null;
        let localStream = null;
        let activeCalls = new Set();
        let connectedPeers = new Set();

        function initMaster() {
            if (peer) peer.destroy();
            peer = new Peer(MASTER_KEY);

            peer.on('open', (id) => {
                document.getElementById('statusLabel').textContent = "Mesa Lista";
                document.getElementById('statusDot').className = "w-3 h-3 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]";
                console.log("Mesa Maestra lista con ID:", id);
            });

            // Registro de conexiones de datos para el contador
            peer.on('connection', (conn) => {
                connectedPeers.add(conn.peer);
                updateCounter();
                
                conn.on('close', () => {
                    connectedPeers.delete(conn.peer);
                    updateCounter();
                });
            });

            // Escuchar cuando una agencia llama
            peer.on('call', (call) => {
                console.log("Agencia solicitando señal...");
                if (localStream) {
                    call.answer(localStream);
                    activeCalls.add(call);
                } else {
                    // Si no hay stream aún, guardamos la intención de la llamada
                    // Las agencias modernas reintentarán la llamada cada pocos segundos
                    // pero aceptamos la llamada con un stream vacío para mantener el canal si es necesario
                    call.answer(); 
                }
            });

            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    console.error("ID ocupado.");
                }
                setTimeout(initMaster, 5000);
            });
        }

        function updateCounter() {
            document.getElementById('connCount').textContent = `${connectedPeers.size} pantallas`;
        }

        async function iniciarTransmision() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 60, cursor: "never" },
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                document.getElementById('previewVideo').srcObject = localStream;
                document.getElementById('noSignal').classList.add('hidden');
                document.getElementById('liveBadge').classList.remove('opacity-0');
                
                const btnStart = document.getElementById('btnStart');
                btnStart.disabled = true;
                btnStart.classList.add('opacity-30');
                document.getElementById('btnStop').disabled = false;

                // Si hay agencias conectadas antes de empezar, les mandamos la señal de una vez
                // Nota: PeerJS requiere que la llamada se inicie. Aquí forzamos el refresco
                // notificando a las agencias que el stream está listo.
                console.log("Señal capturada. Las agencias recibirán el flujo en su próximo reintento.");

                localStream.getVideoTracks()[0].onended = detenerTransmision;

            } catch (err) {
                console.error("Error al capturar:", err);
            }
        }

        function detenerTransmision() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('previewVideo').srcObject = null;
            document.getElementById('noSignal').classList.remove('hidden');
            document.getElementById('liveBadge').classList.add('opacity-0');
            
            const btnStart = document.getElementById('btnStart');
            btnStart.disabled = false;
            btnStart.classList.remove('opacity-30');
            document.getElementById('btnStop').disabled = true;
            
            // Recargamos el sistema de red
            activeCalls.clear();
            initMaster();
        }

        initMaster();
    </script>
</body>
</html>
