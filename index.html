<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Broadcast Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; margin: 0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-action { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 lg:p-10">

    <header class="mb-10 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black uppercase tracking-tighter italic">Broadcaster Center</h1>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em]">Gestión: elianmrt334</p>
        </div>
        <div id="cloudStatus" class="flex items-center gap-3 px-5 py-2.5 bg-slate-900/50 rounded-2xl border border-white/5">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-black uppercase opacity-60">Sistema Operativo</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="glass p-8 rounded-[2.5rem] space-y-4">
                <h2 class="text-xs font-black uppercase text-slate-400 mb-4">1. Captura de pantalla</h2>
                <button id="btnCapture" onclick="handleStartCapture()" class="w-full btn-action bg-blue-600 text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 border border-blue-400/20">
                    <i data-lucide="monitor-up"></i> SELECCIONAR VENTANA
                </button>
            </div>
            
            <div class="glass p-8 rounded-[2.5rem] space-y-4">
                <h2 class="text-xs font-black uppercase text-slate-400 mb-4">2. Control de emisión</h2>
                <button id="btnStart" onclick="handleBroadcastStart()" disabled class="w-full btn-action bg-[#158e45] text-white py-4 rounded-2xl font-black text-xl shadow-lg disabled:opacity-30">
                    PUBLICAR SEÑAL
                </button>
                <button id="btnStop" onclick="handleBroadcastStop()" class="w-full btn-action bg-red-900/50 text-red-400 py-3 rounded-2xl font-black text-xs hover:bg-red-800">
                    FINALIZAR TRANSMISIÓN
                </button>
            </div>
        </div>

        <div class="lg:col-span-8 glass rounded-[3rem] p-4 flex items-center justify-center">
            <video id="preview" class="max-h-full rounded-2xl" autoplay muted playsinline></video>
            <div id="noSignal" class="text-center text-slate-600 font-black uppercase tracking-[0.5em] text-xs">
                Sin señal de captura
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const MASTER_ID = 'COOSAJO-MASTER-ELIAN-DIRECT';
        
        let peer = null;
        let localStream = null;

        const init = async () => {
            await signInAnonymously(auth);
            // Evitamos la conexión WebSocket inicializando PeerJS sin host de señalización externo
            // El intercambio de datos se realizará vía Firestore
            peer = new Peer(MASTER_ID, {
                config: { 
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
                },
                debug: 0
            });
            
            console.log("Sistema listo para vinculación remota.");
        };

        window.handleStartCapture = async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const video = document.getElementById('preview');
                video.srcObject = localStream;
                document.getElementById('noSignal').classList.add('hidden');
                document.getElementById('btnStart').disabled = false;
            } catch (err) { alert("Error: Asegúrate de permitir el acceso a pantalla."); }
        };

        window.handleBroadcastStart = async () => {
            await setDoc(doc(db, 'artifacts', 'broadcast-system', 'platform', 'state'), {
                isLive: true,
                masterId: MASTER_ID,
                updatedAt: Date.now()
            });
            alert("¡Transmisión iniciada!");
        };

        window.handleBroadcastStop = async () => {
            await setDoc(doc(db, 'artifacts', 'broadcast-system', 'platform', 'state'), { isLive: false });
            location.reload();
        };

        init();
        lucide.createIcons();
    </script>
</body>
</html>
