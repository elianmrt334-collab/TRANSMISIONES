```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Broadcast Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-action { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-action:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 lg:p-10">

    <header class="flex justify-between items-center mb-10">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-[#158e45] rounded-2xl flex items-center justify-center shadow-2xl">
                <i data-lucide="layout-dashboard" class="text-white w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter italic">Broadcaster Center</h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em]">COOSAJO Cloud Management</p>
            </div>
        </div>
        
        <div id="cloudStatus" class="flex items-center gap-3 px-5 py-2.5 bg-slate-900/50 rounded-2xl border border-white/5">
            <div class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-black uppercase opacity-60">Sincronizando Nube...</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Control Panel -->
        <div class="lg:col-span-4 space-y-6">
            <div class="glass p-8 rounded-[2.5rem] shadow-2xl space-y-8">
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">1. Fuente de Señal (OBS)</label>
                    <button id="btnCapture" onclick="startCapture()" class="w-full btn-action bg-slate-800 text-white py-4 rounded-2xl font-black text-xs flex items-center justify-center gap-3 border border-white/10">
                        <i data-lucide="camera"></i> CAPTURAR VENTANA
                    </button>
                </div>

                <div class="pt-6 border-t border-white/5 space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">2. Tiempo de Bloque</label>
                    <div class="bg-black/40 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                        <input type="number" id="matchTime" value="15" class="bg-transparent border-none text-2xl font-black text-[#158e45] w-16 outline-none">
                        <span class="text-xs font-bold opacity-40">MINUTOS</span>
                    </div>
                </div>

                <div class="pt-6 border-t border-white/5 space-y-4">
                    <button id="btnStart" onclick="publishToCloud()" disabled class="w-full btn-action bg-[#158e45] text-white py-6 rounded-2xl font-black text-xl flex items-center justify-center gap-4 shadow-xl disabled:opacity-20">
                        <i data-lucide="send"></i> PUBLICAR SEÑAL
                    </button>
                    <button id="btnStop" onclick="stopBroadcast()" disabled class="w-full btn-action bg-red-600/10 text-red-500 py-4 rounded-2xl font-black text-xs border border-red-500/20">
                        FINALIZAR TRANSMISIÓN
                    </button>
                </div>
            </div>

            <!-- Online Agencies -->
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-500">Agencias Online</h3>
                    <span id="agenciesCount" class="text-[#158e45] font-black text-xs">0</span>
                </div>
                <div id="agenciesList" class="space-y-2 max-h-[150px] overflow-y-auto">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- Monitor -->
        <div class="lg:col-span-8 relative glass rounded-[3rem] overflow-hidden bg-black flex items-center justify-center border-[8px] border-white/5 shadow-2xl">
            <video id="preview" class="w-full h-full object-contain" autoplay muted playsinline></video>
            <div id="noSignal" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 z-10 transition-opacity">
                <i data-lucide="video-off" class="w-12 h-12 text-slate-800 mb-4"></i>
                <p class="text-slate-600 font-black uppercase tracking-[0.4em] text-[10px]">Monitor de Salida</p>
            </div>
            <div id="onAirBadge" class="absolute top-8 left-8 bg-red-600 px-5 py-2.5 rounded-xl flex items-center gap-3 shadow-2xl opacity-0 transition-opacity">
                <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                <span class="text-xs font-black uppercase tracking-widest italic">Live Platform</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, doc, setDoc, onSnapshot, collection, query } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        lucide.createIcons();

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-coosajo';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const MASTER_ID = 'COOSAJO-MASTER-ELIAN-DIRECT';
        const preview = document.getElementById('preview');
        let localStream = null;
        let peer = null;

        const init = async () => {
            await signInAnonymously(auth);
            document.getElementById('cloudStatus').innerHTML = `<div class="w-2 h-2 bg-green-500 rounded-full"></div><span class="text-[10px] font-black uppercase opacity-60">Nube Activa</span>`;
            
            peer = new Peer(MASTER_ID);
            peer.on('call', (call) => {
                if (localStream) call.answer(localStream);
            });

            // Escuchar agencias conectadas
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'screens'));
            onSnapshot(q, (snapshot) => {
                const screens = snapshot.docs.map(doc => doc.data());
                document.getElementById('agenciesCount').textContent = screens.length;
                document.getElementById('agenciesList').innerHTML = screens.map(s => `
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-[10px] font-black uppercase opacity-60">${s.name}</span>
                    </div>
                `).join('');
            });
        };

        window.startCapture = async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 60, cursor: "never" },
                    audio: { echoCancellation: false, noiseSuppression: false }
                });
                preview.srcObject = localStream;
                document.getElementById('noSignal').classList.add('opacity-0');
                document.getElementById('btnStart').disabled = false;
            } catch (e) { console.error(e); }
        };

        window.publishToCloud = async () => {
            const duration = document.getElementById('matchTime').value;
            // Publicar el estado en Firebase
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'platformState'), {
                isLive: true,
                masterId: MASTER_ID,
                duration: parseInt(duration),
                startTime: Date.now()
            });

            document.getElementById('onAirBadge').classList.remove('opacity-0');
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
        };

        window.stopBroadcast = async () => {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'platformState'), { isLive: false });
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            location.reload();
        };

        init();
    </script>
</body>
</html>
