<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Broadcast Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: white; 
            margin: 0;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .btn-action { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .btn-action:hover:not(:disabled) { 
            transform: translateY(-2px); 
            filter: brightness(1.1); 
        }
        .btn-action:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-action:disabled { 
            opacity: 0.2; 
            cursor: not-allowed; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 lg:p-10">

    <!-- Header de la Plataforma -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-[#158e45] rounded-2xl flex items-center justify-center shadow-2xl shadow-green-900/20">
                <i data-lucide="layout-dashboard" class="text-white w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter italic">Broadcaster Center</h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em]">COOSAJO Cloud Management</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="cloudStatus" class="flex items-center gap-3 px-5 py-2.5 bg-slate-900/50 rounded-2xl border border-white/5">
                <div class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black uppercase opacity-60">Sincronizando Nube...</span>
            </div>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Panel de Control (Izquierda) -->
        <div class="lg:col-span-4 space-y-6">
            <div class="glass p-8 rounded-[2.5rem] shadow-2xl space-y-8 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#158e45] to-transparent"></div>
                
                <div class="space-y-6">
                    <h2 class="text-xl font-black uppercase tracking-tight text-slate-200 flex items-center gap-3">
                        <i data-lucide="zap" class="text-[#158e45] w-5 h-5"></i>
                        Gestión de Sesión
                    </h2>

                    <!-- 1. Captura de Fuente -->
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">1. Fuente de Video (OBS)</label>
                        <button id="btnCapture" onclick="handleStartCapture()" class="w-full btn-action bg-slate-800 text-white py-4 rounded-2xl font-black text-xs flex items-center justify-center gap-3 border border-white/10 shadow-lg">
                            <i data-lucide="camera"></i> VINCULAR VENTANA
                        </button>
                    </div>

                    <!-- 2. Parámetros -->
                    <div class="pt-6 border-t border-white/5 space-y-4">
                        <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">2. Configuración</label>
                        <div class="bg-black/40 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-bold text-slate-500 uppercase">Tiempo del Bloque</span>
                                <div class="flex items-center gap-2">
                                    <input type="number" id="matchTime" value="15" class="bg-transparent border-none text-2xl font-black text-[#158e45] w-16 outline-none">
                                    <span class="text-[10px] font-bold opacity-40">MIN</span>
                                </div>
                            </div>
                            <i data-lucide="timer" class="text-slate-700 w-8 h-8"></i>
                        </div>
                    </div>

                    <!-- 3. Acciones -->
                    <div class="pt-6 border-t border-white/5 space-y-4">
                        <button id="btnStart" onclick="handleBroadcastStart()" disabled class="w-full btn-action bg-[#158e45] text-white py-6 rounded-2xl font-black text-xl flex items-center justify-center gap-4 shadow-xl shadow-green-900/20 disabled:opacity-20">
                            <i data-lucide="send"></i> PUBLICAR SEÑAL
                        </button>
                        <button id="btnStop" onclick="handleBroadcastStop()" disabled class="w-full btn-action bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-4 rounded-2xl font-black text-xs border border-red-500/20 disabled:opacity-20">
                            FINALIZAR TRANSMISIÓN
                        </button>
                    </div>
                </div>
            </div>

            <!-- Monitor de Agencias Conectadas -->
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <div class="flex justify-between items-center px-2">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-500">Agencias Online</h3>
                    <span id="agenciesCount" class="bg-[#158e45] text-white text-[10px] px-2 py-0.5 rounded-full font-black">0</span>
                </div>
                <div id="agenciesList" class="space-y-2 max-h-[160px] overflow-y-auto custom-scrollbar">
                    <div class="text-center py-6 opacity-20">
                        <i data-lucide="loader-2" class="w-6 h-6 mx-auto animate-spin mb-2"></i>
                        <span class="text-[9px] font-bold uppercase">Escaneando pantallas...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Monitor Maestro (Derecha) -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            <div class="relative flex-1 glass rounded-[3rem] overflow-hidden bg-black flex items-center justify-center border-[8px] border-white/5 shadow-2xl">
                <video id="preview" class="w-full h-full object-contain" autoplay muted playsinline></video>
                
                <div id="noSignal" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 z-10 transition-opacity duration-700">
                    <div class="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mb-6 animate-pulse">
                        <i data-lucide="video-off" class="w-10 h-10 text-slate-800"></i>
                    </div>
                    <p class="text-slate-600 font-black uppercase tracking-[0.5em] text-xs">Monitor de Salida</p>
                </div>

                <div id="onAirBadge" class="absolute top-8 left-8 bg-red-600 px-5 py-2.5 rounded-xl flex items-center gap-3 shadow-2xl opacity-0 transition-opacity">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-black uppercase tracking-widest italic">Live en Esquipulas</span>
                </div>
            </div>

            <!-- Panel de Notificaciones/Mensajes -->
            <div id="infoBox" class="glass p-6 rounded-3xl flex items-center justify-between border-l-8 border-blue-500">
                <div class="flex items-center gap-4">
                    <i data-lucide="info" class="text-blue-500 w-6 h-6"></i>
                    <div>
                        <p class="text-xs font-black uppercase">Estado del Sistema</p>
                        <p id="statusMsg" class="text-[10px] text-slate-400">Listo para capturar señal de OBS.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, doc, setDoc, onSnapshot, collection, query } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        lucide.createIcons();

        // 1. Configuración de Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'coosajo-broadcast-system';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const MASTER_ID = 'COOSAJO-MASTER-ELIAN-DIRECT';
        const preview = document.getElementById('preview');
        const statusMsg = document.getElementById('statusMsg');
        
        let localStream = null;
        let peer = null;
        let user = null;

        // 2. Inicialización
        const init = async () => {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (u) {
                        document.getElementById('cloudStatus').innerHTML = `
                            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                            <span class="text-[10px] font-black uppercase opacity-60">Nube Conectada</span>
                        `;
                        iniciarPeer();
                        escucharAgencias();
                    }
                });
            } catch (e) { 
                console.error("Error Auth:", e);
                statusMsg.textContent = "Error al conectar con la nube.";
            }
        };

        // 3. PeerJS
        const iniciarPeer = () => {
            if (peer) peer.destroy();
            peer = new Peer(MASTER_ID);
            
            peer.on('open', (id) => console.log("Peer ID:", id));
            
            peer.on('call', (call) => {
                if (localStream) {
                    console.log("Atendiendo llamada de agencia...");
                    call.answer(localStream);
                }
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'unavailable-id') {
                    statusMsg.textContent = "Error: El ID Maestro ya está en uso.";
                }
            });
        };

        // 4. Firestore: Monitor de Agencias
        const escucharAgencias = () => {
            if (!user) return;
            const screensRef = collection(db, 'artifacts', appId, 'public', 'data', 'screens');
            onSnapshot(query(screensRef), (snapshot) => {
                const screens = snapshot.docs.map(doc => doc.data());
                updateAgenciesUI(screens);
            }, (err) => console.error("Error screens:", err));
        };

        const updateAgenciesUI = (screens) => {
            const list = document.getElementById('agenciesList');
            document.getElementById('agenciesCount').textContent = screens.length;
            
            if (screens.length === 0) {
                list.innerHTML = '<p class="text-[10px] opacity-20 italic text-center py-6">Sin agencias conectadas</p>';
                return;
            }

            list.innerHTML = screens.map(s => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                        <span class="text-[10px] font-black uppercase opacity-80">${s.name || 'Agencia'}</span>
                    </div>
                    <span class="text-[8px] font-bold opacity-30 uppercase">LIVE</span>
                </div>
            `).join('');
        };

        // 5. Funciones Globales para los botones
        window.handleStartCapture = async () => {
            statusMsg.textContent = "Solicitando permisos de captura...";
            try {
                // Configuración de captura optimizada
                const constraints = {
                    video: { 
                        frameRate: { ideal: 60, max: 60 },
                        cursor: "never"
                    },
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    }
                };

                // Intentar capturar pantalla
                localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                
                preview.srcObject = localStream;
                document.getElementById('noSignal').classList.add('opacity-0');
                document.getElementById('btnStart').disabled = false;
                document.getElementById('btnCapture').classList.add('opacity-30');
                statusMsg.textContent = "Señal de OBS vinculada correctamente.";

                // Si dejas de compartir desde el navegador
                localStream.getVideoTracks()[0].onended = () => handleBroadcastStop();

            } catch (err) {
                console.error("Fallo en captura:", err);
                statusMsg.textContent = "Error: Captura cancelada o permiso denegado.";
                alert("Para Mac Elián:\n1. Asegúrate que Chrome tiene permiso de 'Grabación de pantalla' en Ajustes del Sistema.\n2. Si ya lo tiene, intenta reiniciar Chrome.\n3. Selecciona la ventana del proyector de OBS.");
            }
        };

        window.handleBroadcastStart = async () => {
            if (!user || !localStream) return;
            const duration = document.getElementById('matchTime').value;
            
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'platformState'), {
                    isLive: true,
                    masterId: MASTER_ID,
                    matchDuration: parseInt(duration),
                    startTime: Date.now()
                });

                document.getElementById('onAirBadge').classList.remove('opacity-0');
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnStop').disabled = false;
                statusMsg.textContent = "¡SEÑAL AL AIRE! Todas las agencias están sincronizadas.";
            } catch (err) {
                console.error("Error al publicar:", err);
                statusMsg.textContent = "Error al subir estado a la nube.";
            }
        };

        window.handleBroadcastStop = async () => {
            if (!user) return;
            statusMsg.textContent = "Finalizando transmisión...";
            
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'platformState'), {
                    isLive: false
                });
                
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                
                setTimeout(() => location.reload(), 800);
            } catch (err) {
                console.error("Error al detener:", err);
                location.reload();
            }
        };

        // Iniciar
        init();
    </script>
</body>
</html>
