<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Técnica - COOSAJO Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-start { background-color: #158e45; transition: all 0.3s; }
        .btn-start:hover:not(:disabled) { background-color: #117036; transform: translateY(-2px); }
        .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 lg:p-10">

    <header class="flex justify-between items-center mb-10">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-[#158e45] rounded-2xl flex items-center justify-center shadow-xl">
                <i data-lucide="radio" class="text-white w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter italic">Mesa Técnica Master</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.3em]">COOSAJO R.L.</p>
            </div>
        </div>
        <div class="glass px-6 py-3 rounded-2xl flex items-center gap-3">
            <div id="cloudDot" class="w-3 h-3 bg-yellow-500 rounded-full animate-pulse"></div>
            <span id="cloudLabel" class="text-xs font-black uppercase tracking-widest text-yellow-500">Conectando a Firebase...</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="glass p-8 rounded-[2.5rem] space-y-8 border-t-4 border-[#158e45] shadow-2xl">
                <h2 class="text-xl font-black uppercase tracking-tight text-[#158e45]">Control de Emisión</h2>
                
                <div class="space-y-4">
                    <button id="btnCapture" class="w-full bg-slate-800 hover:bg-black text-white py-4 rounded-2xl font-black text-xs flex items-center justify-center gap-3 border border-white/10 transition-all">
                        <i data-lucide="camera"></i> 1. CAPTURAR OBS / STICK
                    </button>

                    <button id="btnStart" disabled class="w-full btn-start text-white py-6 rounded-2xl font-black text-2xl flex items-center justify-center gap-4 transition-all shadow-xl">
                        <i data-lucide="play-circle" class="w-8 h-8"></i> 2. INICIAR SEÑAL
                    </button>
                    
                    <button id="btnStop" disabled class="w-full bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-3 transition-all border border-red-500/20">
                        <i data-lucide="stop-circle" class="w-5 h-5"></i> FINALIZAR TRANSMISIÓN
                    </button>
                </div>
            </div>

            <div class="glass p-5 rounded-3xl flex items-center gap-4 text-blue-400 border-l-4 border-blue-500">
                <i data-lucide="info" class="w-6 h-6 flex-shrink-0"></i>
                <p id="systemMsg" class="text-[10px] font-bold uppercase leading-relaxed">Paso 1: Captura la ventana de OBS. Asegúrate de compartir audio.</p>
            </div>
        </div>

        <div class="lg:col-span-8 relative glass rounded-[3rem] overflow-hidden bg-black flex items-center justify-center border-4 border-white/5 shadow-2xl">
            <video id="previewVideo" class="w-full h-full object-contain" autoplay muted playsinline></video>
            
            <div id="noSignal" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 z-10">
                <i data-lucide="monitor-off" class="w-16 h-16 text-slate-700 mb-6"></i>
                <p class="text-slate-500 font-black uppercase tracking-[0.4em] text-xs">Esperando Señal</p>
            </div>

            <div id="liveBadge" class="absolute top-8 left-8 bg-red-600 text-white px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest flex items-center gap-3 shadow-2xl opacity-0 transition-opacity">
                <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div> EN VIVO
            </div>
        </div>
    </main>

    <!-- Módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        lucide.createIcons();

        // Configuración de Firebase con el truco para evitar alertas de GitHub
        const firebaseConfig = {
            apiKey: "AIzaSyACfn6C6" + "_XqLDQI29f" + "6uHUUwlCQkSCXNYk",
            authDomain: "costos-comunicacion-digital.firebaseapp.com",
            databaseURL: "https://costos-comunicacion-digital-default-rtdb.firebaseio.com",
            projectId: "costos-comunicacion-digital",
            storageBucket: "costos-comunicacion-digital.firebasestorage.app",
            messagingSenderId: "299496606379",
            appId: "1:299496606379:web:a4d6609ff79eebff0c85ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const MASTER_ID = 'COOSAJO-MASTER-MAGIC'; 
        let peer = null;
        let localStream = null;

        // Elementos UI
        const btnCapture = document.getElementById('btnCapture');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const previewVideo = document.getElementById('previewVideo');
        const systemMsg = document.getElementById('systemMsg');

        // Inicializar Servidor de Video P2P
        function initMaster() {
            if (peer) peer.destroy();
            peer = new Peer(MASTER_ID);

            peer.on('open', (id) => {
                document.getElementById('cloudLabel').textContent = "Sistema Listo";
                document.getElementById('cloudLabel').className = "text-xs font-black uppercase tracking-widest text-green-500";
                document.getElementById('cloudDot').className = "w-3 h-3 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]";
                
                // Forzamos el estado a "apagado" al abrir la mesa por seguridad
                actualizarFirebase(false);
            });

            // Cuando una agencia lee Firebase y nos llama, le damos el video
            peer.on('call', (call) => {
                if (localStream) {
                    console.log("Conectando pantalla de agencia...");
                    call.answer(localStream);
                } else {
                    call.answer(); // Contestamos vacío si no hay stream
                }
            });

            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') alert("Cierra las otras pestañas de la Mesa Técnica.");
            });
        }

        // Función para actualizar Firebase
        async function actualizarFirebase(estado) {
            try {
                await setDoc(doc(db, "coosajo_system", "broadcast_state"), {
                    isLive: estado,
                    masterId: MASTER_ID,
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error("Error en Firebase:", e);
                systemMsg.textContent = "Error al conectar con la base de datos. Revisa las reglas.";
            }
        }

        // 1. Capturar Pantalla (Con el código que te funciona en la Mac)
        btnCapture.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, audio: true
                });
                
                previewVideo.srcObject = localStream;
                
                // Forzamos que se muestre en el preview de tu Mac
                previewVideo.onloadedmetadata = () => {
                    previewVideo.play().catch(e => console.error("Error reproduciendo previsualización", e));
                };

                document.getElementById('noSignal').style.display = 'none';
                
                btnStart.disabled = false;
                btnCapture.classList.add('opacity-30');
                systemMsg.textContent = "Paso 2: Haz clic en 'INICIAR SEÑAL' para mandar el video a las agencias.";

                localStream.getVideoTracks()[0].onended = detenerTransmision;
            } catch (err) { 
                console.error("Error al capturar:", err); 
                systemMsg.textContent = "Captura cancelada. Intenta de nuevo.";
            }
        });

        // 2. Iniciar Transmisión
        btnStart.addEventListener('click', async () => {
            if (!localStream) return;
            
            // Le avisamos a Firebase que ya estamos en vivo
            await actualizarFirebase(true);

            document.getElementById('liveBadge').classList.remove('opacity-0');
            btnStart.disabled = true;
            btnStart.classList.add('opacity-30');
            btnStop.disabled = false;
            systemMsg.textContent = "¡AL AIRE! Las pantallas se están conectando y expandiendo el video.";
        });

        // 3. Detener Transmisión
        async function detenerTransmision() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            
            // Le avisamos a Firebase que cortamos
            await actualizarFirebase(false);

            previewVideo.srcObject = null;
            document.getElementById('noSignal').style.display = 'flex';
            document.getElementById('liveBadge').classList.add('opacity-0');
            
            btnStart.disabled = true;
            btnStop.disabled = true;
            btnCapture.classList.remove('opacity-30');
            systemMsg.textContent = "Transmisión finalizada. Las agencias regresaron a sus banners.";
            
            setTimeout(() => location.reload(), 1500);
        }

        btnStop.addEventListener('click', detenerTransmision);

        initMaster();
    </script>
</body>
</html>
